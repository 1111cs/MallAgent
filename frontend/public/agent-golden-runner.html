<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MallAgent Golden Case Runner</title>
  <style>
    body{margin:0;background:#f4f7fb;color:#172033;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:1380px;margin:24px auto;padding:0 18px}.card{background:#fff;border:1px solid #dbe4f0;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px #0f172a0d}h1{margin:0 0 8px}p{color:#526079}button{border:0;border-radius:9px;padding:9px 14px;background:#2563eb;color:#fff;font-weight:650;cursor:pointer;margin:3px}button.secondary{background:#64748b}button.danger{background:#b91c1c}button:disabled{opacity:.48;cursor:not-allowed}.tokens,.groups{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{padding:6px 10px;border-radius:999px;background:#eef2ff;color:#3730a3}.ok{color:#047857;font-weight:700}.bad{color:#b91c1c;font-weight:700}.muted{color:#64748b}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left;vertical-align:top}.answer{max-width:430px;white-space:pre-wrap}.status{min-width:95px}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}code{background:#eef2f7;padding:2px 5px;border-radius:5px}#progress{font-weight:650}
  </style>
</head>
<body><main>
  <section class="card">
    <h1>MallAgent Golden Case Runner</h1>
    <p>运行 20 条固定业务用例，并使用 execution-record 自动检查路由、工具、参数来源和任务状态。</p>
    <div class="tokens">
      <strong>评测账号：</strong>
      <button data-capture="U001">保存当前登录为 U001</button><span id="token-U001" class="pill">未保存</span>
      <button data-capture="U002">保存当前登录为 U002</button><span id="token-U002" class="pill">未保存</span>
      <button data-capture="U003">保存当前登录为 U003</button><span id="token-U003" class="pill">未保存</span>
    </div>
  </section>
  <section class="card">
    <div class="toolbar"><div class="groups">
      <button data-group="KB_ONLY">运行 5 条知识库用例</button>
      <button data-group="NORMAL_TOOL">运行 5 条普通工具用例</button>
      <button data-group="MISSING_PARAMETER">运行 4 条缺参用例</button>
      <button data-group="AMBIGUOUS_ENTITY">运行 3 条消歧用例</button>
      <button data-group="TOOL_DEPENDENCY">运行 3 条依赖用例</button>
      <button id="run-all">运行全部未完成</button>
      <button id="stop" class="danger" disabled>停止当前条</button>
    </div><div><span id="progress">等待运行</span> <button id="download" class="secondary">下载当前结果</button><button id="clear" class="secondary">清空结果</button></div></div>
  </section>
  <section class="card"><table><thead><tr><th>ID</th><th>用户</th><th>问题</th><th>状态</th><th>回答</th><th>执行轨迹</th><th>结构断言</th><th>耗时</th></tr></thead><tbody id="rows"></tbody></table></section>
</main><script>
const TOKEN_IDS={U001:'9000000000000000101',U002:'9000000000000000102',U003:'9000000000000000103'};
const TOKEN_PREFIX='hm_golden_token_'; const QUERY=new URLSearchParams(location.search); const CASES_URL=QUERY.get('cases')||'/agent-golden-cases-v1.json'; const ASSERTIONS_URL=QUERY.get('assertions')||'/agent-golden-assertions-v1.json'; const RESULT_KEY='hm_golden_progress_'+CASES_URL;
const rows=document.querySelector('#rows'),progress=document.querySelector('#progress'),stopButton=document.querySelector('#stop');
let suite=null,assertionSuite=null,results=JSON.parse(localStorage.getItem(RESULT_KEY)||'[]'),activeController=null,stopped=false,running=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tokenFor=p=>localStorage.getItem(TOKEN_PREFIX+p);
function save(){localStorage.setItem(RESULT_KEY,JSON.stringify(results));render()}
function tokenBadges(){for(const p of Object.keys(TOKEN_IDS)){const el=document.querySelector('#token-'+p);el.textContent=tokenFor(p)?'已保存':'未保存';el.className='pill '+(tokenFor(p)?'ok':'')}}
function render(){if(!suite)return;const byId=Object.fromEntries(results.map(x=>[x.id,x]));rows.innerHTML=suite.cases.map(c=>{const r=byId[c.id],e=r?.evaluation;return `<tr><td>${c.id}<br><span class="muted">${c.category}</span></td><td>${c.principalId}</td><td>${esc(c.question)}</td><td class="status ${r?.status==='COMPLETED'?'ok':r?'bad':''}">${esc(r?.status||'PENDING')} ${r?.error?'<br>'+esc(r.error):''}<br><button class="secondary" data-case="${c.id}">重跑本条</button></td><td class="answer">${esc(r?.answer||'')}</td><td>${r?.traceId?esc(r.traceId):'—'}<br><span class="muted">${r?.trace?.nodes?.length??0} nodes</span></td><td class="${e?.passed?'ok':e?'bad':''}">${e?(e.passed?'PASS':'FAIL'):'—'}<br><span class="muted">${esc(e?.failureStage||'')}</span></td><td>${r?Math.round(r.durationMs/1000)+' s':'—'}</td></tr>`}).join('');rows.querySelectorAll('[data-case]').forEach(btn=>btn.onclick=()=>runSelected([suite.cases.find(c=>c.id===btn.dataset.case)],true))}
async function apiJson(url,token){const res=await fetch(url,{headers:{Authorization:token}});const json=await res.json().catch(()=>({}));if(!res.ok||json.success===false)throw new Error(json.message||`HTTP ${res.status}`);return json.data??json}
async function apiPostJson(url,token,body){const res=await fetch(url,{method:'POST',headers:{Authorization:token,'Content-Type':'application/json'},body:JSON.stringify(body)});const json=await res.json().catch(()=>({}));if(!res.ok||json.success===false)throw new Error(json.message||`HTTP ${res.status}`);return json.data??json}
document.querySelectorAll('[data-capture]').forEach(btn=>btn.onclick=async()=>{const p=btn.dataset.capture,token=localStorage.getItem('ragent_token');if(!token){progress.textContent='请先在主页面登录 '+p;return}try{const user=await apiJson('/api/ragent/user/me',token);if(String(user.userId)!==TOKEN_IDS[p])throw new Error(`当前用户 ID ${user.userId} 与 ${p} 不匹配`);localStorage.setItem(TOKEN_PREFIX+p,token);tokenBadges();progress.textContent=`已保存 ${p} 登录态`}catch(e){progress.textContent=e.message}});
function parseSseBlock(block){let event='message',data=[];for(const line of block.split(/\r?\n/)){if(line.startsWith('event:'))event=line.slice(6).trim();else if(line.startsWith('data:'))data.push(line.slice(5).trim())}if(!data.length)return null;const raw=data.join('\n');let payload=raw;try{payload=JSON.parse(raw)}catch{}return {event,payload}}
async function loadTrace(taskId,token){for(let i=0;i<12;i++){try{const page=await apiJson(`/api/ragent/rag/traces/runs?current=1&size=5&taskId=${encodeURIComponent(taskId)}`,token);const run=page.records?.[0];if(run?.traceId){const detail=await apiJson(`/api/ragent/rag/traces/runs/${encodeURIComponent(run.traceId)}`,token);return detail}}catch{}await new Promise(r=>setTimeout(r,1000))}return null}
async function runCase(c,index,total){const token=tokenFor(c.principalId);if(!token)throw new Error(`缺少 ${c.principalId} 登录态`);const started=performance.now();let answer='',thinking='',taskId=null,conversationId=null,messageId=null,title=null,rawEvents=[];activeController=new AbortController();const timeout=setTimeout(()=>activeController.abort('240 秒超时'),240000);const ticker=setInterval(()=>progress.textContent=`运行 ${index}/${total}: ${c.id}（${Math.floor((performance.now()-started)/1000)} 秒）`,1000);try{try{await apiJson('/api/ragent/user/me',token)}catch{localStorage.removeItem(TOKEN_PREFIX+c.principalId);tokenBadges();throw new Error(c.principalId+' 登录态失效，请在当前 '+location.origin+' 登录后重新保存')}const groundingEvaluation=QUERY.get('groundingEvaluation')==='true';const url=`/api/ragent/rag/v3/chat?question=${encodeURIComponent(c.question)}&deepThinking=false&groundingEvaluation=${groundingEvaluation}`;const response=await fetch(url,{headers:{Accept:'text/event-stream',Authorization:token},signal:activeController.signal});if(!response.ok)throw new Error(`SSE HTTP ${response.status}`);const reader=response.body.getReader(),decoder=new TextDecoder('utf-8');let buffer='';while(true){const {value,done}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});const parts=buffer.split(/\r?\n\r?\n/);buffer=parts.pop()||'';for(const part of parts){const evt=parseSseBlock(part);if(!evt)continue;rawEvents.push(evt);const p=evt.payload;if(evt.event==='meta'){taskId=p.taskId;conversationId=p.conversationId}else if(evt.event==='message'){if(p?.type==='response')answer+=p.delta||'';if(p?.type==='think')thinking+=p.delta||''}else if(evt.event==='reject'){answer+=p?.delta||''}else if(evt.event==='finish'||evt.event==='cancel'){messageId=p?.messageId||messageId;title=p?.title||title}}if(done)break}if(buffer.trim()){const evt=parseSseBlock(buffer);if(evt)rawEvents.push(evt)}const trace=taskId?await loadTrace(taskId,token):null;const traceId=trace?.run?.traceId||null;const assertion=assertionSuite?.cases?.find(x=>x.caseId===c.id);const evaluation=traceId&&assertion?await apiPostJson('/api/ragent/rag/eval/golden/assert',token,{caseId:c.id,traceId,expected:assertion.expected}):null;return {...c,status:'COMPLETED',answer,thinking,taskId,conversationId,messageId,title,traceId,trace,evaluation,rawEvents,durationMs:Math.round(performance.now()-started),completedAt:new Date().toISOString()}}catch(e){const isAbort=e?.name==='AbortError';if(taskId){fetch(`/api/ragent/rag/v3/stop?taskId=${encodeURIComponent(taskId)}`,{method:'POST',headers:{Authorization:token}}).catch(()=>{})}return {...c,status:stopped?'STOPPED':isAbort?'TIMEOUT':'ERROR',answer,thinking,taskId,conversationId,messageId,title,traceId:null,trace:null,rawEvents,durationMs:Math.round(performance.now()-started),error:stopped?'用户停止':isAbort?'240 秒超时':String(e?.message||e),completedAt:new Date().toISOString()}}finally{clearTimeout(timeout);clearInterval(ticker);activeController=null}}
async function runSelected(cases,rerunCompleted=false){if(running)return;const missing=[...new Set(cases.map(c=>c.principalId).filter(p=>!tokenFor(p)))];if(missing.length){progress.textContent='缺少登录态：'+missing.join(', ');return}running=true;stopped=false;stopButton.disabled=false;document.querySelectorAll('[data-group],[data-case],#run-all').forEach(x=>x.disabled=true);const doneIds=new Set(results.filter(x=>x.status==='COMPLETED').map(x=>x.id));const pending=rerunCompleted?cases:cases.filter(c=>!doneIds.has(c.id));for(let i=0;i<pending.length&&!stopped;i++){const c=pending[i],result=await runCase(c,i+1,pending.length);results=results.filter(x=>x.id!==c.id).concat(result);save()}running=false;stopButton.disabled=true;document.querySelectorAll('[data-group],[data-case],#run-all').forEach(x=>x.disabled=false);progress.textContent=stopped?'已停止，结果已保存':`本组完成；累计 ${results.filter(x=>x.status==='COMPLETED').length}/`}
document.querySelectorAll('[data-group]').forEach(btn=>btn.onclick=()=>runSelected(suite.cases.filter(c=>c.category===btn.dataset.group),true));
document.querySelector('#run-all').onclick=()=>runSelected(suite.cases);stopButton.onclick=()=>{stopped=true;activeController?.abort()};
document.querySelector('#download').onclick=()=>{const report={suite:suite.suite,evaluationVersion:suite.evaluationVersion,datasetVersion:suite.datasetVersion,asOf:suite.asOf,generatedAt:new Date().toISOString(),resultCount:results.length,results:suite.cases.map(c=>results.find(r=>r.id===c.id)).filter(Boolean)};const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mall-agent-golden-result-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;a.click();URL.revokeObjectURL(a.href)};
document.querySelector('#clear').onclick=()=>{if(running)return;results=[];localStorage.removeItem(RESULT_KEY);render();progress.textContent='结果已清空'};
addEventListener('beforeunload',()=>activeController?.abort());
Promise.all([fetch(CASES_URL,{cache:'no-store'}).then(r=>r.json()),fetch(ASSERTIONS_URL,{cache:'no-store'}).then(r=>r.json())]).then(([cases,assertions])=>{suite=cases;assertionSuite=assertions;tokenBadges();render()}).catch(e=>progress.textContent='加载 Case/断言失败：'+e.message);
</script></body></html>
